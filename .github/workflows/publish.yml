# dsh-auto-check publish: test and publish to npm on version tags.
#
# Uses npm Trusted Publishing (OIDC) — no long-lived npm token in secrets.
#
# One-time setup:
#   1. Claim the package name with the first manual publish:
#        npm login --registry=https://registry.npmjs.org
#        npm publish --registry=https://registry.npmjs.org --access public
#   2. On npmjs.com: package → Settings → Trusted Publishing →
#      add provider "GitHub Actions" for ltzXiaoYanMo/dsh-auto-check,
#      workflow file "publish.yml".
#   3. From then on, tag a version and push it:
#        git tag v0.1.1
#        git push origin v0.1.1
#
# The `dsh-plugins` tag is a repository milestone, not an npm release trigger.
name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing / provenance

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
